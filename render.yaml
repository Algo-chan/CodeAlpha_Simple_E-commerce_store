# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One file describes the whole deployment: a Docker web service that serves the
# API and the storefront from a single origin, plus the managed PostgreSQL it
# reads. Point Render at this repository and it provisions both.
#
# What you get, once applied:
#   - https://<service-name>.onrender.com   the storefront and the API
#   - a managed PostgreSQL bound to DATABASE_URL
#   - migrations applied on every boot (see the Dockerfile's CMD)
#
# Secrets marked `generateValue` are created by Render and never leave its
# dashboard, so this file holds no credentials and can be committed.
#
# NOTE ON THE FREE PLAN
#   The `free` database is time-limited (Render expires it after a period) and
#   the free web service sleeps after inactivity, waking on the next request.
#   Move both to a paid plan for a store that has to stay up.

databases:
  - name: roman-store-db
    databaseName: roman_store
    user: roman_store
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: roman-store
    runtime: docker
    plan: free
    # Render uses the repository root as the build context.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # --- Database ---------------------------------------------------------
      # Bound to the database above; Render wires the connection string in.
      - key: DATABASE_URL
        fromDatabase:
          name: roman-store-db
          property: connectionString
      # Render's managed Postgres presents a certificate Node's default trust
      # store does not recognise. The connection is still TLS; only the CA check
      # is skipped, and only for this host.
      - key: DB_SSL
        value: 'true'
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: 'false'

      # --- Secrets ----------------------------------------------------------
      # 32+ characters, generated by Render. The app refuses to boot in
      # production without them, and refuses a pair that shares a value.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # --- Same-origin CORS -------------------------------------------------
      # The browser sends an `Origin` header even on same-origin writes, so the
      # deployed origin has to be allow-listed. Render injects RENDER_EXTERNAL_URL
      # automatically and the app trusts it, so the default *.onrender.com origin
      # needs no configuration. Add PUBLIC_ORIGIN here if you front the site with
      # a custom domain, e.g. `PUBLIC_ORIGIN: https://shop.example.com`.

      # --- Payments ---------------------------------------------------------
      # Cash on delivery only. Switching this to MOCK also requires
      # PAYMENT_WEBHOOK_SECRET (16+ characters), because the app refuses to
      # accept unsigned webhooks in production.
      - key: PAYMENT_PROVIDER
        value: NONE
